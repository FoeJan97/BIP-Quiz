<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BIP-Check – Zählt das zum BIP?</title>
<meta name="theme-color" content="#eef4ff">
<style>
:root{
  --bg1:#eef4ff;
  --bg2:#f7f9fc;
  --card:#ffffff;
  --text:#122033;
  --muted:#65758b;
  --line:#dce4ee;
  --yes:#16835e;
  --no:#c84b4b;
  --accent:#2856c7;
  --accent2:#7b4cc2;
  --goodbg:#eaf8f2;
  --badbg:#fff0f0;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 10%, rgba(40,86,199,.12), transparent 30%),
    radial-gradient(circle at 90% 15%, rgba(123,76,194,.10), transparent 28%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
}
button{font:inherit}
.app{
  max-width:1100px;
  margin:0 auto;
  padding:24px 20px 46px;
}
.header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:18px;
}
.brand-kicker{
  text-transform:uppercase;
  letter-spacing:.14em;
  font-weight:800;
  color:var(--accent);
  font-size:13px;
}
h1{
  font-size:clamp(34px,5vw,62px);
  line-height:1;
  margin:5px 0 8px;
}
.subtitle{
  color:var(--muted);
  font-size:18px;
}
.score-pill{
  background:rgba(255,255,255,.82);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 10px 30px rgba(25,43,71,.08);
  backdrop-filter:blur(10px);
  padding:12px 16px;
  border-radius:16px;
  font-weight:800;
  white-space:nowrap;
}
.progress-shell{
  height:12px;
  background:#dfe7f2;
  border-radius:999px;
  overflow:hidden;
  margin:10px 0 20px;
}
.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .45s ease;
}
.card{
  overflow:hidden;
  background:var(--card);
  border:1px solid rgba(255,255,255,.9);
  border-radius:28px;
  box-shadow:0 24px 70px rgba(31,50,81,.14);
}
.visual{
  position:relative;
  height:330px;
  background:linear-gradient(135deg,#dfeaff,#f5edff);
  display:grid;
  place-items:center;
  overflow:hidden;
}
.visual:before,.visual:after{
  content:"";
  position:absolute;
  border-radius:50%;
  filter:blur(1px);
}
.visual:before{
  width:300px;height:300px;
  background:rgba(255,255,255,.45);
  top:-120px;right:-60px;
}
.visual:after{
  width:220px;height:220px;
  background:rgba(40,86,199,.07);
  bottom:-100px;left:-40px;
}
.illustration{
  width:min(540px,85%);
  height:250px;
  position:relative;
  z-index:1;
}

/* SVG-Grafiken immer an den Illustrationsbereich anpassen.
   Ohne diese Regel verwenden Inline-SVGs auf mobilen Browsern teils
   ihre Standardgröße (300 × 150 px) und werden dadurch abgeschnitten. */
.illustration > svg{
  display:block;
  width:100%;
  height:100%;
  max-width:100%;
  max-height:100%;
  overflow:visible;
}
.counter{
  position:absolute;
  top:18px;left:20px;
  z-index:3;
  padding:8px 12px;
  background:rgba(255,255,255,.86);
  border:1px solid rgba(255,255,255,.8);
  border-radius:999px;
  font-weight:800;
  color:#334155;
}
.content{
  padding:30px;
}
.category{
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.12em;
  font-weight:800;
  color:var(--accent);
  margin-bottom:10px;
}
.question-title{
  font-size:clamp(26px,3.4vw,42px);
  line-height:1.12;
  font-weight:850;
  margin-bottom:12px;
}
.case{
  font-size:clamp(18px,2vw,23px);
  line-height:1.55;
  color:#344357;
  max-width:900px;
}
.prompt{
  margin-top:22px;
  font-size:20px;
  font-weight:800;
}
.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:18px;
}
.answer-btn{
  border:0;
  border-radius:18px;
  min-height:74px;
  font-size:21px;
  font-weight:850;
  cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, opacity .2s ease;
}
.answer-btn:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 12px 26px rgba(30,50,80,.12);
}
.answer-btn:disabled{cursor:default}
.yes{background:#e8f7f1;color:#116347}
.no{background:#fff0f0;color:#9d3434}
.feedback{
  display:none;
  margin-top:20px;
  border-radius:18px;
  padding:18px 20px;
  line-height:1.5;
  font-size:17px;
}
.feedback.good{display:block;background:var(--goodbg);border:1px solid #c6eadb}
.feedback.bad{display:block;background:var(--badbg);border:1px solid #f3cccc}
.feedback strong{font-size:19px}
.next-row{
  display:none;
  justify-content:flex-end;
  margin-top:18px;
}
.next-btn,.restart-btn{
  border:0;
  color:white;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  font-weight:850;
  padding:14px 22px;
  border-radius:14px;
  cursor:pointer;
  font-size:17px;
}
.result{
  display:none;
  padding:40px 30px 34px;
  text-align:center;
}
.result-icon{
  width:118px;height:118px;
  margin:0 auto 18px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#e6edff,#f4eaff);
  font-size:55px;
}
.result h2{
  font-size:clamp(32px,4vw,50px);
  margin:0 0 8px;
}
.result-score{
  font-size:clamp(52px,8vw,92px);
  font-weight:900;
  line-height:1;
  margin:24px 0 8px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.result-text{font-size:19px;color:var(--muted)}
.grade{
  display:inline-block;
  margin:20px 0 25px;
  padding:10px 16px;
  border-radius:999px;
  background:#eef2ff;
  color:#3748a5;
  font-weight:850;
}
.review{
  text-align:left;
  margin:28px auto;
  max-width:850px;
}
.review h3{font-size:22px}
.review-item{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 16px;
  margin:10px 0;
  line-height:1.45;
}
.review-item.correct{border-left:5px solid var(--yes)}
.review-item.wrong{border-left:5px solid var(--no)}
.legend{
  margin-top:16px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}
@media(max-width:720px){
  .header{align-items:flex-start;flex-direction:column}
  .visual{height:250px}
  .illustration{height:190px}
  .content{padding:22px}
  .answers{grid-template-columns:1fr}
}

/* --- Tablet- und Smartphone-Optimierung --- */
html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  min-height:100svh;
  overscroll-behavior-y:contain;
}
button, select{
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.app{
  padding-left:max(16px, env(safe-area-inset-left));
  padding-right:max(16px, env(safe-area-inset-right));
  padding-bottom:max(34px, env(safe-area-inset-bottom));
}
.answer-btn,
.next-btn,
.restart-btn{
  min-height:56px;
}
.answer-btn:active:not(:disabled),
.next-btn:active,
.restart-btn:active{
  transform:scale(.985);
}
@media (hover:none){
  .answer-btn:hover:not(:disabled){
    transform:none;
    box-shadow:none;
  }
}
@media(max-width:900px){
  .app{max-width:820px;padding-top:18px}
  .header{margin-bottom:14px}
  .score-pill{font-size:15px;padding:10px 13px}
  .visual{height:280px}
  .illustration{height:215px;width:min(500px,88%)}
  .content{padding:24px}
  .question-title{font-size:clamp(25px,5vw,38px)}
  .case{font-size:clamp(18px,2.8vw,22px)}
  .prompt{font-size:19px}
}
@media(max-width:640px){
  .app{
    padding-top:14px;
    padding-left:max(12px, env(safe-area-inset-left));
    padding-right:max(12px, env(safe-area-inset-right));
  }
  .header{
    gap:10px;
    margin-bottom:12px;
  }
  .brand-kicker{font-size:11px}
  h1{font-size:clamp(34px,11vw,48px);margin-bottom:5px}
  .subtitle{font-size:15px;line-height:1.35}
  .score-pill{
    align-self:flex-start;
    border-radius:13px;
    padding:9px 12px;
  }
  .progress-shell{height:9px;margin:8px 0 14px}
  .card{border-radius:20px}
  .visual{height:205px}
  .illustration{height:155px;width:94%}
  .counter{
    top:11px;left:12px;
    font-size:12px;padding:6px 9px;
  }
  .content{padding:18px 16px 20px}
  .category{font-size:11px;margin-bottom:7px}
  .question-title{
    font-size:clamp(24px,7vw,31px);
    line-height:1.08;
    margin-bottom:10px;
  }
  .case{
    font-size:17px;
    line-height:1.45;
  }
  .prompt{
    margin-top:17px;
    font-size:17px;
  }
  .answers{
    grid-template-columns:1fr;
    gap:10px;
    margin-top:13px;
  }
  .answer-btn{
    min-height:64px;
    border-radius:15px;
    font-size:18px;
    padding:12px 14px;
  }
  .feedback{
    margin-top:14px;
    border-radius:14px;
    padding:14px;
    font-size:15.5px;
    line-height:1.45;
  }
  .feedback strong{font-size:17px}
  .next-row{margin-top:13px}
  .next-btn{
    width:100%;
    min-height:56px;
    font-size:16px;
  }
  .result{
    padding:26px 16px 24px;
  }
  .result-icon{
    width:88px;height:88px;
    font-size:40px;
    margin-bottom:14px;
  }
  .result h2{font-size:32px}
  .result-score{font-size:64px;margin-top:18px}
  .result-text{font-size:16px;line-height:1.45}
  .grade{margin:15px 0 20px}
  .review{
    margin:20px auto;
  }
  .review h3{font-size:19px}
  .review-item{
    font-size:14.5px;
    padding:12px;
  }
  .restart-btn{
    width:100%;
    min-height:56px;
  }
  .legend{
    margin-top:12px;
    font-size:12px;
    line-height:1.4;
    padding:0 4px;
  }
}
@media(max-width:380px){
  .visual{height:180px}
  .illustration{height:135px}
  .content{padding:16px 13px 18px}
  .question-title{font-size:23px}
  .case{font-size:16px}
  .answer-btn{font-size:17px}
}
@media(orientation:landscape) and (max-height:600px) and (max-width:1000px){
  .app{max-width:980px;padding-top:10px}
  .header{
    display:grid;
    grid-template-columns:1fr auto;
    align-items:end;
    margin-bottom:8px;
  }
  h1{font-size:34px}
  .subtitle{font-size:14px}
  .progress-shell{margin:6px 0 10px}
  .card{
    display:grid;
    grid-template-columns:minmax(280px,.85fr) 1.15fr;
  }
  .visual{
    height:auto;
    min-height:360px;
  }
  .illustration{height:190px}
  .content{padding:18px}
  .question-title{font-size:27px}
  .case{font-size:16px}
  .prompt{font-size:16px;margin-top:13px}
  .answers{gap:9px;margin-top:11px}
  .answer-btn{min-height:56px;font-size:16px}
  .feedback{font-size:14px;padding:11px;margin-top:11px}
  .result{
    display:none;
    grid-template-columns:1fr;
  }
}

/* --- Erweiterte Smartphone- und Tablet-Optimierung --- */
:root{
  --page-pad:clamp(12px,2.6vw,24px);
}

html,body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  min-height:100dvh;
}

.app{
  width:100%;
  padding-top:max(14px, env(safe-area-inset-top));
  padding-left:max(var(--page-pad), env(safe-area-inset-left));
  padding-right:max(var(--page-pad), env(safe-area-inset-right));
  padding-bottom:max(34px, env(safe-area-inset-bottom));
}

button{
  -webkit-user-select:none;
  user-select:none;
}

.answer-btn,.next-btn,.restart-btn{
  min-height:56px;
  touch-action:manipulation;
}

.answer-btn:focus-visible,.next-btn:focus-visible,.restart-btn:focus-visible{
  outline:3px solid rgba(40,86,199,.35);
  outline-offset:3px;
}

/* Tablets: kompakter, aber weiterhin großzügige Touch-Ziele */
@media (min-width:641px) and (max-width:1024px){
  .app{max-width:900px}
  .header{align-items:center}
  h1{font-size:clamp(38px,6vw,54px)}
  .subtitle{font-size:17px}
  .visual{height:clamp(235px,31vw,300px)}
  .illustration{height:clamp(175px,24vw,225px);width:min(520px,90%)}
  .content{padding:clamp(22px,3.4vw,30px)}
  .question-title{font-size:clamp(28px,4.5vw,38px)}
  .case{font-size:clamp(18px,2.4vw,21px)}
  .answers{gap:12px}
  .answer-btn{font-size:19px;padding:13px 16px}
}

/* Smartphones: Inhalte priorisieren, Illustration kompakter */
@media (max-width:640px){
  .app{padding-top:max(10px, env(safe-area-inset-top))}
  .header{gap:8px}
  .score-pill{font-size:14px}
  .visual{height:clamp(150px,43vw,205px)}
  .illustration{height:clamp(112px,33vw,155px);width:96%}
  .content{padding:16px 14px 18px}
  .category{margin-bottom:6px}
  .question-title{font-size:clamp(22px,7vw,30px)}
  .case{font-size:clamp(16px,4.7vw,18px);line-height:1.42}
  .prompt{font-size:16.5px;margin-top:15px}
  .answers{gap:9px;margin-top:12px}
  .answer-btn{min-height:60px;font-size:17px;padding:11px 12px}
  .feedback{font-size:15px;padding:13px 14px}
  .feedback strong{font-size:16.5px}
  .next-btn,.restart-btn{min-height:54px}
}

/* Sehr kleine Smartphones */
@media (max-width:390px){
  .app{padding-left:max(10px, env(safe-area-inset-left));padding-right:max(10px, env(safe-area-inset-right))}
  .visual{height:145px}
  .illustration{height:108px}
  .content{padding:14px 12px 16px}
  .question-title{font-size:21px}
  .case{font-size:15.5px}
  .answer-btn{font-size:16px;min-height:58px}
  .counter{top:9px;left:10px}
}

/* Geräte mit wenig vertikalem Platz: Scrollwege verkürzen */
@media (max-height:760px) and (max-width:640px){
  .header .subtitle{display:none}
  .progress-shell{margin-bottom:10px}
  .visual{height:128px}
  .illustration{height:96px}
  .content{padding-top:13px}
  .question-title{margin-bottom:7px}
  .prompt{margin-top:12px}
}

/* Tablet/Smartphone im Querformat */
@media (orientation:landscape) and (max-height:600px) and (max-width:1100px){
  .app{max-width:1080px;padding-top:max(8px, env(safe-area-inset-top))}
  .header{grid-template-columns:minmax(0,1fr) auto;gap:12px}
  .header .subtitle{display:none}
  .card{grid-template-columns:minmax(230px,.72fr) minmax(0,1.28fr)}
  .visual{min-height:300px}
  .illustration{height:165px;width:92%}
  .content{padding:14px 16px}
  .category{margin-bottom:5px}
  .question-title{font-size:clamp(22px,3vw,28px);margin-bottom:7px}
  .case{font-size:15.5px;line-height:1.38}
  .prompt{font-size:15.5px;margin-top:10px}
  .answers{gap:8px;margin-top:9px}
  .answer-btn{min-height:50px;font-size:15.5px;padding:8px 10px}
  .feedback{font-size:13.5px;padding:10px 11px;margin-top:9px}
  .feedback strong{font-size:15px}
  .next-row{margin-top:9px}
  .next-btn{min-height:48px;padding:10px 16px}
}

/* Resultatansicht auf kleinen Geräten */
@media (max-width:640px){
  .result{padding-bottom:max(24px, env(safe-area-inset-bottom))}
  .review-item{overflow-wrap:anywhere}
}

/* --- Portrait-Fix für Smartphone-Grafiken ---
   Muss nach den allgemeinen Smartphone-/Low-Height-Regeln stehen.
   So wird der Illustrationsbereich im Hochformat nicht auf 128–145 px
   zusammengestaucht und Inline-SVGs bleiben vollständig sichtbar. */
@media (orientation:portrait) and (max-width:640px){
  .visual{
    height:190px !important;
    min-height:190px;
    padding:8px 0 12px;
    overflow:hidden;
  }
  .illustration{
    width:94% !important;
    height:150px !important;
    max-height:150px;
    margin:auto;
    transform:translateY(-2px);
  }
  .illustration > svg{
    display:block;
    width:100% !important;
    height:100% !important;
    max-width:100%;
    max-height:100%;
    overflow:visible;
  }
}

@media (orientation:portrait) and (max-width:390px){
  .visual{
    height:176px !important;
    min-height:176px;
  }
  .illustration{
    height:138px !important;
    max-height:138px;
    width:95% !important;
  }
}

</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <div class="brand-kicker">Volkswirtschaft · Lernspiel</div>
      <h1>BIP-Check</h1>
      <div class="subtitle">Zählt das zum Bruttoinlandsprodukt – oder nicht?</div>
    </div>
    <div class="score-pill">Punkte: <span id="score">0</span> / 15</div>
  </div>

  <div class="progress-shell"><div id="progress" class="progress-bar"></div></div>

  <div id="quizCard" class="card">
    <div class="visual">
      <div id="counter" class="counter">1 / 15</div>
      <div id="illustration" class="illustration"></div>
    </div>
    <div class="content">
      <div id="category" class="category">Fall</div>
      <div id="title" class="question-title"></div>
      <div id="case" class="case"></div>
      <div class="prompt">Wird dieser Vorgang im BIP erfasst?</div>

      <div class="answers">
        <button id="yesBtn" class="answer-btn yes">✓ Ja, zählt zum BIP</button>
        <button id="noBtn" class="answer-btn no">✕ Nein, zählt nicht</button>
      </div>

      <div id="feedback" class="feedback"></div>

      <div id="nextRow" class="next-row">
        <button id="nextBtn" class="next-btn">Nächste Aufgabe →</button>
      </div>
    </div>
  </div>

  <div id="result" class="card result">
    <div class="result-icon">📊</div>
    <h2>Auswertung</h2>
    <div id="resultScore" class="result-score"></div>
    <div id="resultText" class="result-text"></div>
    <div id="grade" class="grade"></div>
    <div id="review" class="review"></div>
    <button id="restartBtn" class="restart-btn">Nochmal spielen</button>
  </div>

  <div class="legend">Merksatz: Das BIP erfasst den Wert der im Inland neu produzierten Waren und Dienstleistungen innerhalb eines bestimmten Zeitraums.</div>
</div>

<script>
function scene(type){
  const common = `viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true"`;
  const svg = {
    car: `<svg ${common}>
      <rect x="80" y="180" width="440" height="14" rx="7" fill="#b7c4d8"/>
      <path d="M165 165 L215 105 Q235 85 275 85 H375 Q405 85 430 115 L470 165 Z" fill="#315bc5"/>
      <rect x="232" y="100" width="75" height="48" rx="7" fill="#dfeeff"/>
      <rect x="316" y="100" width="75" height="48" rx="7" fill="#dfeeff"/>
      <rect x="140" y="150" width="350" height="55" rx="24" fill="#4773df"/>
      <circle cx="220" cy="204" r="30" fill="#233149"/><circle cx="220" cy="204" r="13" fill="#dbe3ee"/>
      <circle cx="420" cy="204" r="30" fill="#233149"/><circle cx="420" cy="204" r="13" fill="#dbe3ee"/>
      <rect x="454" y="160" width="22" height="12" rx="5" fill="#ffe694"/>
      <circle cx="485" cy="94" r="38" fill="#fff" opacity=".75"/>
      <text x="485" y="104" text-anchor="middle" font-size="30">€</text>
    </svg>`,
    usedcar: `<svg ${common}>
      <rect x="70" y="187" width="460" height="12" rx="6" fill="#b7c4d8"/>

let current=0, score=0;
let responses=[];

const el = id => document.getElementById(id);

function render(){
  const q=questions[current];
  el("counter").textContent=`${current+1} / ${questions.length}`;
  el("progress").style.width=`${(current/questions.length)*100}%`;
  el("score").textContent=score;
  el("category").textContent=q.category;
  el("title").textContent=q.title;
  el("case").textContent=q.case;
  el("illustration").innerHTML=scene(q.image);
  el("feedback").className="feedback";
  el("feedback").style.display="none";
  el("nextRow").style.display="none";
  el("yesBtn").disabled=false;
  el("noBtn").disabled=false;
  el("yesBtn").style.opacity="1";
  el("noBtn").style.opacity="1";
  el("nextBtn").textContent = current===questions.length-1 ? "Auswertung anzeigen →" : "Nächste Aufgabe →";
}

function answer(choice){
  const q=questions[current];
  const correct=choice===q.answer;
  if(correct) score++;
  responses.push({index:current,choice,correct});
  el("score").textContent=score;

  const fb=el("feedback");
  fb.className=`feedback ${correct?"good":"bad"}`;
  fb.innerHTML=`<strong>${correct?"✓ Richtig":"✕ Nicht ganz"}</strong><br>${q.explanation}`;
  fb.style.display="block";

  el("yesBtn").disabled=true;
  el("noBtn").disabled=true;
  el("yesBtn").style.opacity = q.answer ? "1" : ".55";
  el("noBtn").style.opacity = !q.answer ? "1" : ".55";
  el("nextRow").style.display="flex";
}

function next(){
  if(current<questions.length-1){
    current++;
    render();
  }else{
    showResult();
  }
}

function showResult(){
  el("quizCard").style.display="none";
  el("result").style.display="block";
  el("progress").style.width="100%";
  el("resultScore").textContent=`${score} / ${questions.length}`;

  let text="", grade="";
  const pct=score/questions.length;
  if(pct===1){text="Perfekt – alle Fälle sicher eingeordnet.";grade="BIP-Profi 🏆";}
  else if(pct>=.8){text="Sehr stark – die Grundlogik sitzt.";grade="Sehr sicher";}
  else if(pct>=.6){text="Solide Grundlage – ein paar Grenzfälle lohnen sich noch.";grade="Gut unterwegs";}
  else if(pct>=.4){text="Die Richtung stimmt, aber einige BIP-Fallen sind noch offen.";grade="Noch üben";}
  else{text="Da steckt noch Lernpotenzial drin – gerade bei Gebrauchtgütern, Eigenleistungen und Finanztransaktionen.";grade="Nochmal probieren";}
  el("resultText").textContent=text;
  el("grade").textContent=grade;

  let wrong=responses.filter(r=>!r.correct);
  let html="<h3>Deine Fehler im Überblick</h3>";
  if(!wrong.length){
    html += `<div class="review-item correct"><strong>Keine Fehler.</strong> Alle 15 Fälle wurden richtig eingeordnet.</div>`;
  }else{
    wrong.forEach(r=>{
      const q=questions[r.index];
      html += `<div class="review-item wrong"><strong>${r.index+1}. ${q.title}</strong><br>
      Richtig wäre: <b>${q.answer?"Zählt zum BIP":"Zählt nicht zum BIP"}</b>.<br>
      ${q.explanation}</div>`;
    });
  }
  el("review").innerHTML=html;
}

function restart(){
  current=0; score=0; responses=[];
  el("quizCard").style.display="block";
  el("result").style.display="none";
  render();
}

el("yesBtn").addEventListener("click",()=>answer(true));
el("noBtn").addEventListener("click",()=>answer(false));
el("nextBtn").addEventListener("click",next);
el("restartBtn").addEventListener("click",restart);

render();

// Mobile UX: Feedback automatisch in den sichtbaren Bereich holen.
const originalAnswer = answer;
answer = function(choice){
  originalAnswer(choice);
  if(window.matchMedia("(max-width: 640px), (max-height: 600px)").matches){
    requestAnimationFrame(()=>{
      const fb = document.getElementById("feedback");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      fb.scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block:"nearest"});
    });
  }
};

// Tastatursteuerung für Unterricht/Beamer bleibt ebenfalls möglich.
document.addEventListener("keydown",(e)=>{
  if(document.getElementById("result").style.display==="block") return;
  if(!document.getElementById("yesBtn").disabled){
    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="j") answer(true);
    if(e.key==="ArrowRight" || e.key.toLowerCase()==="n") answer(false);
  }else if(e.key==="Enter" || e.key===" "){
    e.preventDefault();
    next();
  }
});
